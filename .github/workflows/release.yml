name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
  release:
    permissions:
      contents: write
    needs: ['test']
    runs-on: ubuntu-latest
    steps:
    # git checkout
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false
    # Go env
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: 'go.mod'
        cache: false
    # The release script tags logging/vX on the commit right before the release commit, so
    # goreleaser would pick it as the "previous tag" and the changelog would only show that
    # commit. Pin the previous tag to the prior plain vX.Y.Z release instead.
    - name: Find previous release tag
      run: |
        PREV=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -x -F "${GITHUB_REF_NAME}" | grep -v -- '-' | head -n1)
        echo "Previous release tag: ${PREV}"
        echo "GORELEASER_PREVIOUS_TAG=${PREV}" >> "$GITHUB_ENV"
    # Release
    - name: Create Release
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
